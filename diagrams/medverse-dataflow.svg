<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#003a75"/>
    </marker>
    <style>
      .title { font:700 14px Arial, sans-serif; fill:#003a75; }
      .label { font:600 12px Arial, sans-serif; fill:#003a75; }
      .label-white { font:600 12px Arial, sans-serif; fill:#ffffff; }
      .note { font:400 11px Arial, sans-serif; fill:#444; }
      .subtle { fill:#f4f6f8; stroke:#cfd8e3; }
      .connector { stroke:#003a75; stroke-width:1.2; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>

  <!-- External Sources group -->
  <rect x="20" y="20" width="420" height="420" class="subtle" rx="12" ry="12"/>
  <text x="34" y="40" class="title">External Sources</text>

  <g>
    <rect x="40" y="60" width="200" height="36" rx="6" ry="6" style="fill:#ffffff;stroke:#005EB8;stroke-width:2"/>
    <text x="54" y="84" class="label">PubMed E-Utilities</text>

    <rect x="40" y="110" width="200" height="36" rx="6" ry="6" style="fill:#ffffff;stroke:#005EB8;stroke-width:2"/>
    <text x="54" y="134" class="label">ClinicalTrials.gov API</text>

    <rect x="40" y="160" width="200" height="36" rx="6" ry="6" style="fill:#ffffff;stroke:#005EB8;stroke-width:2"/>
    <text x="54" y="184" class="label">NEJM, JAMA, Medscape</text>

    <rect x="40" y="210" width="200" height="36" rx="6" ry="6" style="fill:#ffffff;stroke:#005EB8;stroke-width:2"/>
    <text x="54" y="234" class="label">UpToDate / OpenEvidence / OTIS</text>

    <rect x="40" y="260" width="200" height="36" rx="6" ry="6" style="fill:#e6f7ff;stroke:#005EB8;stroke-width:1.5"/>
    <text x="54" y="284" class="label">Orion Signal Source</text>

    <rect x="260" y="60" width="200" height="36" rx="6" ry="6" style="fill:#e6f7ff;stroke:#005EB8;stroke-width:1.5"/>
    <text x="274" y="84" class="label">Expert Hub (HCP profiles)</text>

    <rect x="260" y="110" width="200" height="36" rx="6" ry="6" style="fill:#ffffff;stroke:#005EB8;stroke-width:2"/>
    <text x="274" y="134" class="label">OneCRM / Sanofi CRM</text>

    <rect x="260" y="160" width="200" height="36" rx="6" ry="6" style="fill:#ffffff;stroke:#005EB8;stroke-width:2"/>
    <text x="274" y="184" class="label">Campus+ (Magnolia, TalentLMS, Nova)</text>

    <rect x="260" y="210" width="200" height="36" rx="6" ry="6" style="fill:#ffffff;stroke:#005EB8;stroke-width:2"/>
    <text x="274" y="234" class="label">Vimeo (media host)</text>

    <rect x="260" y="260" width="200" height="36" rx="6" ry="6" style="fill:#e6f7ff;stroke:#005EB8;stroke-width:1.5"/>
    <text x="274" y="284" class="label">Internal KB (OS CSV, OS Complete)</text>
  </g>

  <!-- API Proxy -->
  <rect x="520" y="180" width="260" height="64" rx="8" ry="8" style="fill:#ff7a00;stroke:#cc5f00;stroke-width:2" />
  <text x="548" y="214" class="label-white">API Proxies and Ingestion</text>
  <text x="548" y="234" class="note">CORS proxy, /api/pubmed, ingestion</text>

  <!-- connectors External -> Proxy -->
  <path d="M240 78 L520 210" class="connector"/>
  <path d="M240 128 L520 220" class="connector"/>
  <path d="M240 178 L520 230" class="connector"/>
  <path d="M240 228 L520 240" class="connector"/>
  <path d="M240 278 L520 250" class="connector"/>
  <path d="M420 78 L520 200" class="connector"/>
  <path d="M420 128 L520 210" class="connector"/>
  <path d="M420 178 L520 220" class="connector"/>
  <path d="M420 228 L520 230" class="connector"/>
  <path d="M420 278 L520 240" class="connector"/>

  <!-- Indexing -->
  <rect x="820" y="160" width="260" height="64" rx="8" ry="8" style="fill:#5BC0FF;stroke:#0072b1;stroke-width:2" />
  <text x="848" y="196" class="label">Ingestion and Indexing</text>
  <text x="848" y="216" class="note">Parsing, metadata, RAG indexes</text>
  <path d="M780 200 L820 190" class="connector"/>

  <!-- Hubs -->
  <rect x="1160" y="40" width="320" height="84" rx="8" ry="8" style="fill:#e6f7ff;stroke:#005EB8;stroke-width:1.5"/>
  <text x="1180" y="70" class="label">Literature Intelligence</text>
  <text x="1180" y="90" class="note">(PubMed index, article cache)</text>

  <rect x="1160" y="150" width="320" height="84" rx="8" ry="8" style="fill:#e6f7ff;stroke:#005EB8;stroke-width:1.5"/>
  <text x="1180" y="180" class="label">Trials Intelligence</text>

  <rect x="1160" y="260" width="320" height="84" rx="8" ry="8" style="fill:#e6f7ff;stroke:#005EB8;stroke-width:1.5"/>
  <text x="1180" y="290" class="label">Orion Signal Intelligence</text>

  <rect x="1160" y="370" width="320" height="84" rx="8" ry="8" style="fill:#e6f7ff;stroke:#005EB8;stroke-width:1.5"/>
  <text x="1180" y="400" class="label">Expert HCP Hub</text>

  <rect x="1160" y="480" width="320" height="84" rx="8" ry="8" style="fill:#e6f7ff;stroke:#005EB8;stroke-width:1.5"/>
  <text x="1180" y="510" class="label">Authoritative KB</text>

  <!-- Index -> Hubs -->
  <path d="M1080 190 L1160 110" class="connector"/>
  <path d="M1080 210 L1160 190" class="connector"/>
  <path d="M1080 230 L1160 300" class="connector"/>
  <path d="M1080 250 L1160 400" class="connector"/>
  <path d="M1080 270 L1160 520" class="connector"/>

  <!-- Agents and LLMs -->
  <rect x="520" y="320" width="260" height="72" rx="8" ry="8" style="fill:#6f42c1;stroke:#59309a;stroke-width:1.5" />
  <text x="560" y="354" class="label-white">RAG and Agents Layer</text>
  <text x="560" y="372" class="label-white">Retriever, tooling, rules</text>

  <rect x="520" y="420" width="260" height="56" rx="8" ry="8" style="fill:#6f42c1;stroke:#59309a;stroke-width:1.5" />
  <text x="560" y="448" class="label-white">LLMs (Claude, ChatGPT, Gemini)</text>

  <!-- Hubs -> Agents -->
  <path d="M1280 120 L780 350" class="connector"/>
  <path d="M1280 200 L780 380" class="connector"/>
  <path d="M1280 320 L780 380" class="connector"/>
  <path d="M1280 420 L780 380" class="connector"/>
  <path d="M1280 520 L780 380" class="connector"/>
  <path d="M640 392 L640 420" class="connector"/>

  <!-- Platform -->
  <rect x="820" y="520" width="440" height="96" rx="8" ry="8" style="fill:#005EB8;stroke:#003a75;stroke-width:2" />
  <text x="860" y="568" class="label-white">MedVerse Platform - Magnolia / Desktop App / POC web</text>
  <path d="M780 392 L820 540" class="connector"/>

  <!-- Users -->
  <rect x="1400" y="620" width="320" height="80" rx="8" ry="8" style="fill:#34d399;stroke:#1f9a6f;stroke-width:1.5" />
  <text x="1420" y="660" class="label-white">MSLs, HCPs, Medical Affairs, Patients</text>
  <path d="M1280 600 L1400 660" class="connector"/>

  <!-- CRM / Audit -->
  <rect x="520" y="640" width="280" height="64" rx="8" ry="8" style="fill:#f4f6f8;stroke:#cfd8e3;stroke-width:1" />
  <text x="548" y="672" class="label">Audit and Compliance Logs</text>
  <path d="M1080 600 L760 660" class="connector"/>
  <path d="M640 600 L640 700" class="connector"/>

  <text x="34" y="470" class="note">Tip: Upload this vector image into Miro for crisp scaling.</text>
</svg>
