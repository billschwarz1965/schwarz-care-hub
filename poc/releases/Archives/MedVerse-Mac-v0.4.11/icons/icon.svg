<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#7a00e6"/>
  <g transform="translate(256,256)" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <!-- Brain outline left hemisphere -->
    <path d="M-8,-90 C-50,-90 -90,-65 -100,-25 C-110,15 -95,50 -75,70 C-55,90 -30,95 -8,90"/>
    <!-- Brain outline right hemisphere -->
    <path d="M8,-90 C50,-90 90,-65 100,-25 C110,15 95,50 75,70 C55,90 30,95 8,90"/>
    <!-- Center divide -->
    <line x1="0" y1="-90" x2="0" y2="90"/>
    <!-- Left folds -->
    <path d="M-8,-40 C-40,-40 -55,-20 -55,5"/>
    <path d="M-8,15 C-45,15 -65,35 -55,60"/>
    <!-- Right folds -->
    <path d="M8,-40 C40,-40 55,-20 55,5"/>
    <path d="M8,15 C45,15 65,35 55,60"/>
    <!-- Neural nodes -->
    <circle cx="-55" cy="5" r="6" fill="#fff" stroke="none"/>
    <circle cx="55" cy="5" r="6" fill="#fff" stroke="none"/>
    <circle cx="-55" cy="60" r="6" fill="#fff" stroke="none"/>
    <circle cx="55" cy="60" r="6" fill="#fff" stroke="none"/>
    <circle cx="0" cy="-90" r="6" fill="#fff" stroke="none"/>
    <circle cx="0" cy="90" r="6" fill="#fff" stroke="none"/>
    <!-- Neural connections -->
    <line x1="-55" y1="5" x2="55" y2="5" stroke-dasharray="6,8" stroke-width="3" opacity="0.5"/>
    <line x1="-55" y1="60" x2="55" y2="60" stroke-dasharray="6,8" stroke-width="3" opacity="0.5"/>
  </g>
</svg>
