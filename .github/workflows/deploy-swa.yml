name: Deploy MedVerse POC to Azure Static Web Apps

on:
  push:
    branches: [main, master]
    paths:
      - 'poc/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: poc/package-lock.json

      - name: Install dependencies
        run: cd poc && npm ci

      - name: Build
        run: cd poc && npm run build

      - name: Check for deployment token
        id: check_token
        run: |
          if [ -n "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::AZURE_STATIC_WEB_APPS_API_TOKEN is not set — skipping deploy. No Azure Static Web App has been provisioned for this repo yet; see poc-external's GitHub Pages deployment for the current published demo."
          fi

      - name: Deploy to Azure Static Web Apps
        if: steps.check_token.outputs.has_token == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: poc/dist
          skip_app_build: true
          skip_api_build: true
