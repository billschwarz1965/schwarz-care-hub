name: Deploy demo builds to GitHub Pages

on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build poc-external
        working-directory: poc-external
        run: |
          npm install
          npm run build

      - name: Build poc-internal
        working-directory: poc-internal
        run: |
          npm install
          npm run build

      - name: Assemble Pages site
        run: |
          mkdir -p site
          cp -r poc-external/dist site/poc-external
          cp -r poc-internal/dist site/poc-internal
          cp -r poc/sitemap-options site/sitemap-options
          cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>MedVerse Demos</title>
            <style>
              body { font-family: system-ui, sans-serif; background: #f7f5fa; color: #1a1a2e; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
              .card { background: #fff; border: 1px solid #e4dff0; border-radius: 16px; padding: 32px 40px; max-width: 480px; box-shadow: 0 8px 32px rgba(122,0,230,0.08); }
              h1 { font-size: 20px; margin: 0 0 16px; }
              a.link { display: block; padding: 14px 18px; margin-top: 10px; border-radius: 10px; background: #f0e6ff; color: #6b21a8; text-decoration: none; font-weight: 600; }
              a.link:hover { background: #7a00e6; color: #fff; }
            </style>
          </head>
          <body>
            <div class="card">
              <h1>MedVerse Demos</h1>
              <a class="link" href="poc-external/index.html">POC — External Edition</a>
              <a class="link" href="poc-internal/index.html">POC — Internal Edition (MSL &amp; Medical Affairs)</a>
              <a class="link" href="sitemap-options/index.html">Sitemap Options</a>
            </div>
          </body>
          </html>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
